<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101D32" />
    <meta name="description" content="ProofLedger AI — evidence-backed invoice decisions." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ProofLedger AI</title>
    <style>
      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        min-width: 320px;
        overflow: hidden;
        color: #f8fafc;
        background: #101d32;
        font-family: Inter, Manrope, "SF Pro Text", "Segoe UI", sans-serif;
      }
      .boot-screen::before {
        content: "";
        position: absolute;
        width: 520px;
        height: 520px;
        border: 1px solid rgba(142, 164, 255, .08);
        border-radius: 50%;
        box-shadow: 0 0 0 100px rgba(118, 207, 195, .025), 0 0 0 200px rgba(118, 207, 195, .015);
      }
      .boot-content {
        position: relative;
        width: min(410px, calc(100vw - 48px));
        text-align: center;
      }
      .boot-icon {
        width: 76px;
        height: 76px;
        display: grid;
        place-items: center;
        margin: 0 auto 22px;
        border: 1px solid rgba(255,255,255,.13);
        border-radius: 22px;
        background: #4263eb;
        box-shadow: 0 18px 42px rgba(4, 32, 41, .36), inset 0 1px 0 rgba(255,255,255,.2);
      }
      .boot-icon svg { width: 45px; height: 45px; }
      .boot-title { margin: 0; font-size: 30px; line-height: 1; letter-spacing: -.045em; font-weight: 780; }
      .boot-tagline { margin: 9px 0 30px; color: #aebbd0; font-size: 12px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; }
      .boot-status { margin: 0 0 11px; color: #d5ddea; font-size: 13px; }
      .boot-track { width: 100%; height: 3px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.1); }
      .boot-progress { width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, transparent, #8ea4ff, transparent); animation: boot-progress 1.15s ease-in-out infinite; }
      .boot-note { margin-top: 24px; color: #7f8da3; font-size: 12px; letter-spacing: .06em; }
      @keyframes boot-progress { from { transform: translateX(-120%); } to { transform: translateX(340%); } }
      @media (prefers-reduced-motion: reduce) { .boot-progress { width: 100%; animation: none; background: #6f8cff; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-live="polite" aria-label="Loading ProofLedger AI">
        <div class="boot-content">
          <div class="boot-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 10h22l10 10v32a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4Z" fill="#F8FCFB"/>
              <path d="M40 10v11h11" stroke="#4263EB" stroke-width="4" stroke-linejoin="round"/>
              <path d="m22 38 7 7 15-17" stroke="#4263EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h1 class="boot-title">ProofLedger</h1>
          <p class="boot-tagline">Evidence to decision</p>
          <p class="boot-status">Preparing your invoice command center</p>
          <div class="boot-track" aria-hidden="true"><div class="boot-progress"></div></div>
          <p class="boot-note">SYNTHETIC DEMO ENVIRONMENT</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
